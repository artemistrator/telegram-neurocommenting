<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .menu-item {
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background-color: #374151;
        }

        .menu-item.active {
            background-color: #3b82f6;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
        }

        .content-area {
            margin-left: 250px;
            min-height: 100vh;
        }

        /* Account Cards */
        .account-card {
            transition: all 0.2s ease;
        }

        .account-card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 50;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .content-area {
                margin-left: 0;
            }

            .mobile-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 40;
            }

            .mobile-overlay.active {
                display: block;
            }
        }
    </style>
</head>

<body class="bg-gray-100">
    <!-- Mobile overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- Sidebar -->
    <div class="sidebar bg-gray-800 text-white flex flex-col" id="sidebar">
        <!-- Logo -->
        <div class="p-6 border-b border-gray-700">
            <h1 class="text-2xl font-bold">TG Monitor</h1>
            <p class="text-sm text-gray-400 mt-1">Управление аккаунтами</p>
        </div>

        <!-- Menu -->
        <nav class="flex-1 p-4">
            <a href="#" class="menu-item flex items-center px-4 py-3 rounded-lg mb-2 text-white no-underline"
                data-page="home" data-testid="nav-home">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5a2 2 0 012-2h4a2 2 0 012 2v6H8V5z"></path>
                </svg>
                <span>Главная</span>
            </a>
            <a href="#" class="menu-item flex items-center px-4 py-3 rounded-lg mb-2 text-white no-underline"
                data-page="dashboard" data-testid="nav-dashboard">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                <span>Дашборд</span>
            </a>
            <a href="#" class="menu-item flex items-center px-4 py-3 rounded-lg mb-2 text-white no-underline"
                data-page="proxies" data-testid="nav-proxies">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 01-2 2v4a2 2 0 012 2h14a2 2 0 012-2v-4a2 2 0 01-2-2"></path>
                </svg>
                <span>Прокси</span>
            </a>
            <a href="#" class="menu-item flex items-center px-4 py-3 rounded-lg mb-2 text-white no-underline"
                data-page="accounts" data-testid="nav-accounts">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                </svg>
                <span>Аккаунты</span>
            </a>
            <a href="#" class="menu-item flex items-center px-4 py-3 rounded-lg mb-2 text-white no-underline"
                data-page="templates" data-testid="nav-templates">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <span>Шаблоны</span>
            </a>
            <a href="#" class="menu-item flex items-center px-4 py-3 rounded-lg mb-2 text-white no-underline"
                data-page="channels" data-testid="nav-channels">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.886A1 1 0 0112 5a1 1 0 011 .886v6.228a1 1 0 01-.293.707L11 14.5l-1.707 1.707A1 1 0 018 15.5v-6.228a1 1 0 01.293-.707L10 6.886z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9a7 7 0 01-14 0"></path>
                </svg>
                <span>Каналы</span>
            </a>
        </nav>
        <!-- User Footer -->
        <div class="sidebar-footer p-4 border-t border-gray-700">
            <div class="user-info flex items-center mb-3">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="user-email" class="text-sm truncate max-w-[120px]">user@example.com</span>
            </div>
            <button onclick="logout()" class="flex items-center text-sm text-gray-300 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Выйти
            </button>
        </div>
        <!-- Footer -->
        <div class="p-4 border-t border-gray-700">
            <p class="text-xs text-gray-500 text-center">v1.0.0 © 2025</p>
        </div>
    </div>

    <!-- Mobile menu button -->
    <button class="md:hidden fixed top-4 left-4 z-50 bg-gray-800 text-white p-2 rounded-lg" id="mobileMenuBtn">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- Content Area -->
    <div class="content-area bg-gray-50">
        <div class="p-8" id="content">
            <!-- Dynamic content will be loaded here -->
            <div class="flex items-center justify-center h-64">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                    <p class="text-gray-600">Загрузка...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Navigation functions
        async function loadPage(page) {
            if (window.currentCleanupFunction) {
                try {
                    window.currentCleanupFunction();
                } catch (e) {
                    console.error('Error during page cleanup:', e);
                }
                window.currentCleanupFunction = null;
            }

            // Universal cleanup of all tracked timers
            if (window.App && window.App.core && window.App.core.timers && window.App.core.timers.clearAll) {
                window.App.core.timers.clearAll();
            }

            // Cleanup monitoring features (SSE, intervals)
            if (window.App && window.App.features && window.App.features.monitoring && window.App.features.monitoring.cleanup) {
                window.App.features.monitoring.cleanup();
            }

            try {
                const response = await fetch(`/pages/${page}`);
                if (!response.ok) throw new Error('Page not found');

                const html = await response.text();
                document.getElementById('content').innerHTML = html;

                // Update active menu item
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.classList.remove('active');
                });
                const activeItem = document.querySelector(`[data-page="${page}"]`);
                if (activeItem) {
                    activeItem.classList.add('active');
                }

                // Update URL
                history.pushState({ page }, '', `/${page}`);

                // Close mobile menu if open
                closeMobileMenu();

                // Execute page-specific scripts if any
                await executePageScripts();

                // Initialize page-specific JavaScript for SPA
                // For templates page, we set cleanup function but don't manually init (uses modular boot)
                if (page === 'templates') {
                    // Set cleanup function for templates page
                    setTimeout(() => {
                        if (typeof window.cleanupTemplatesPage === 'function') {
                            window.currentCleanupFunction = window.cleanupTemplatesPage;
                        }
                    }, 100);
                }
                // For parser page, manually call init function
                else if (page === 'parser' && typeof window.initParserPage === 'function') {
                    window.initParserPage();
                    // Set cleanup function if it exists
                    if (typeof window.cleanupParserPage === 'function') {
                        window.currentCleanupFunction = window.cleanupParserPage;
                    }
                }
                // For channels page, manually call init function
                else if (page === 'channels' && typeof window.initChannelsPage === 'function') {
                    window.initChannelsPage();
                    // Set cleanup function if it exists
                    if (typeof window.cleanupChannelsPage === 'function') {
                        window.currentCleanupFunction = window.cleanupChannelsPage;
                    }
                }
                // For other pages that might have init functions
                else if (typeof window[`init${page.charAt(0).toUpperCase() + page.slice(1)}Page`] === 'function') {
                    window[`init${page.charAt(0).toUpperCase() + page.slice(1)}Page`]();
                    // Set cleanup function if it exists
                    if (typeof window[`cleanup${page.charAt(0).toUpperCase() + page.slice(1)}Page`] === 'function') {
                        window.currentCleanupFunction = window[`cleanup${page.charAt(0).toUpperCase() + page.slice(1)}Page`];
                    }
                }
                // For pages with generic init/cleanup functions
                else if (typeof window.cleanup === 'function') {
                    window.currentCleanupFunction = window.cleanup;
                }

            } catch (error) {
                console.error('Error loading page:', error);
                alert('Ошибка загрузки страницы: ' + error.message);
            }
        }

        // Execute scripts in loaded content
        function executePageScripts() {
            const scripts = document.getElementById('content').querySelectorAll('script');
            const promises = [];

            scripts.forEach(script => {
                // Skip already executed scripts
                if (script.dataset.executed === '1') {
                    return;
                }

                // Mark original script as executed
                script.dataset.executed = '1';

                const newScript = document.createElement('script');

                // Copy attributes
                if (script.type) newScript.type = script.type;

                // Copy additional attributes
                if (script.async) newScript.async = script.async;
                if (script.defer) newScript.defer = script.defer;
                if (script.nomodule) newScript.nomodule = script.nomodule;
                if (script.crossorigin) newScript.crossorigin = script.crossorigin;
                if (script.integrity) newScript.integrity = script.integrity;
                if (script.referrerPolicy) newScript.referrerPolicy = script.referrerPolicy;

                if (script.src) {
                    newScript.src = script.src;

                    // Create promise for external scripts
                    const scriptPromise = new Promise((resolve, reject) => {
                        newScript.onload = () => {
                            document.body.removeChild(newScript); // Clean up tag
                            resolve();
                        };
                        newScript.onerror = (e) => {
                            console.error('Script loading error:', e);
                            document.body.removeChild(newScript); // Clean up tag
                            reject(e);
                        };
                    });
                    promises.push(scriptPromise);
                } else {
                    try {
                        newScript.textContent = script.textContent;
                        // Inline scripts execute immediately upon insertion
                    } catch (e) {
                        console.error('Page script error', e);
                    }
                }

                document.body.appendChild(newScript);

                // If it's an inline script, remove it immediately after execution
                if (!newScript.src) {
                    document.body.removeChild(newScript);
                }
            });

            return Promise.all(promises);
        }

        // Mobile menu functions
        function openMobileMenu() {
            document.getElementById('sidebar').classList.add('mobile-open');
            document.getElementById('mobileOverlay').classList.add('active');
        }

        function closeMobileMenu() {
            document.getElementById('sidebar').classList.remove('mobile-open');
            document.getElementById('mobileOverlay').classList.remove('active');
        }

        // Event listeners
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const page = item.dataset.page;
                loadPage(page);
            });
        });

        document.getElementById('mobileMenuBtn').addEventListener('click', openMobileMenu);
        document.getElementById('mobileOverlay').addEventListener('click', closeMobileMenu);

        // Load page on initial load
        window.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname.slice(1) || 'home';
            loadPage(path);
        });

        // Handle browser back/forward
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.page) {
                loadPage(event.state.page);
            } else {
                loadPage('home');
            }
        });

        // Fetch current user and display email
        async function loadUserInfo() {
            console.log('🔍 Loading user info...');
            
            try {
                const response = await fetch('/api/auth/me', {
                    credentials: 'include' // Send cookies
                });
                
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const user = await response.json();
                    console.log('User data received:', user);
                    
                    const emailEl = document.getElementById('user-email');
                    if (emailEl) {
                        // Use email from response
                        emailEl.textContent = user.email || 'unknown@user.com';
                        console.log('✅ Email set to:', user.email);
                    } else {
                        console.error('❌ Element #user-email not found!');
                    }
                } else {
                    console.error('❌ Response not OK:', response.status);
                }
            } catch (error) {
                console.error('💥 Error loading user:', error);
            }
        }
        
        // Call on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOM loaded, calling loadUserInfo...');
            loadUserInfo();
        });

        // Logout function
        async function logout() {
            if (!confirm('Выйти из системы?')) {
                return;
            }

            try {
                // Call backend logout endpoint
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            // Clear cookies
            document.cookie = 'access_token=; path=/; max-age=0';
            document.cookie = 'refresh_token=; path=/; max-age=0';

            // Redirect to login
            window.location.href = '/login';
        }


    </script>

    <script src="/static/js/core/timers.js?v=999"></script>
    <script src="/static/js/pages/channels.page.js?v=999"></script>
    <script src="/static/js/features/monitoring.js?v=999"></script>
    <script src="/static/js/features/telegramAuth.js?v=999"></script>
    <script src="/static/js/pages/settings.page.js?v=999"></script>
    <script src="/static/js/core/dom.js?v=999"></script>
    <script src="/static/js/core/toast.js?v=999"></script>
    <script src="/static/js/api/http.js?v=999"></script>
    <script src="/static/js/pages/parser.page.js?v=999"></script>
    <script src="/static/script.js?v=999"></script>

</body>

</html>
