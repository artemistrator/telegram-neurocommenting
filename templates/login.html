<!DOCTYPE html>
<html>
<head>
    <title>Вход - TG Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl font-bold text-white mb-6">TG Monitor</h1>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-300 mb-2">Email</label>
                <input type="email" id="email" required 
                       class="w-full px-4 py-2 rounded bg-gray-700 text-white border border-gray-600">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-300 mb-2">Пароль</label>
                <input type="password" id="password" required
                       class="w-full px-4 py-2 rounded bg-gray-700 text-white border border-gray-600">
            </div>
            
            <div id="error" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500 rounded text-red-400 text-sm"></div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium">
                Войти
            </button>
        </form>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
