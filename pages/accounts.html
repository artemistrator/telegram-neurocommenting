<div class="max-w-7xl" data-testid="page-accounts">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Управление Аккаунтами</h1>
        <button data-action="openImportModal"
            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            Импорт аккаунтов
        </button>
    </div>

    <!-- Stats Cards - Updated to 2 rows for better layout -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
        <div class="bg-white rounded-lg shadow p-4">
            <p class="text-sm text-gray-600">Всего аккаунтов</p>
            <p class="text-2xl font-bold text-gray-900" id="total-accounts">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
            <p class="text-sm text-gray-600">Активных</p>
            <p class="text-2xl font-bold text-green-600" id="active-accounts">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
            <p class="text-sm text-gray-600">Setup завершен</p>
            <p class="text-2xl font-bold text-blue-600" id="setup-completed">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
            <p class="text-sm text-gray-600">С прокси</p>
            <p class="text-2xl font-bold text-purple-600" id="with-proxy">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
            <p class="text-sm text-gray-600">Забанены</p>
            <p class="text-2xl font-bold text-red-600" id="banned-accounts">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
            <p class="text-sm text-gray-600">В резерве</p>
            <p class="text-2xl font-bold text-yellow-600" id="reserve-accounts">0</p>
        </div>
    </div>

    <!-- Accounts Grid -->
    <div id="accounts-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" data-testid="accounts-grid">
        <!-- Account cards will be rendered here by JavaScript -->
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed top-4 right-4 bg-white shadow-lg rounded-lg p-4 hidden transition-all z-50 max-w-sm">
    <div class="flex items-center">
        <span id="toast-icon" class="text-2xl mr-3"></span>
        <p id="toast-message" class="text-sm font-medium text-gray-800"></p>
    </div>
</div>

<!-- Account Details Modal -->
<div id="accountDetailsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full mx-4">
        <div class="flex justify-between items-center p-6 border-b">
            <h2 class="text-2xl font-bold text-gray-800">Детали аккаунта</h2>
            <button data-action="close-modal" class="text-gray-500 hover:text-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="p-6">
            <div class="flex items-center mb-6">
                <img id="modal-avatar" src="" alt="Avatar" class="w-20 h-20 rounded-full mr-6 border-2 border-gray-100">
                <div>
                    <h3 id="modal-name" class="text-xl font-bold text-gray-900"></h3>
                    <p id="modal-phone" class="text-gray-600 font-mono"></p>
                    <div id="modal-badges" class="flex gap-2 mt-2"></div>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Bio</h4>
                    <p id="modal-bio" class="text-gray-800 mt-1 bg-gray-50 p-2 rounded"></p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Username</h4>
                        <div id="modal-username" class="mt-1 text-blue-600 font-medium"></div>
                    </div>
                    <div>
                        <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Setup Status</h4>
                        <div id="modal-setup" class="mt-1"></div>
                    </div>
                    <div>
                        <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Шаблон</h4>
                        <div id="modal-template" class="mt-1"></div>
                    </div>
                    <div>
                        <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Proxy</h4>
                        <div id="modal-proxy" class="mt-1"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-6 bg-gray-50 rounded-b-lg flex justify-end gap-2">
            <button data-action="runSetup"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                </svg>
                Setup
            </button>
            <button data-action="rerunSetup"
                class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Rerun
            </button>
            <button data-action="close-modal"
                class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded-lg font-medium transition">
                Закрыть
            </button>
        </div>
    </div>
</div>

<!-- Import Modal -->
<div id="importModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center p-6 border-b">
            <h2 class="text-2xl font-bold text-gray-800">Добавить аккаунты</h2>
            <button data-action="close-modal" class="text-gray-500 hover:text-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Tabs -->
        <div class="border-b border-gray-200">
            <nav class="-mb-px flex px-6" aria-label="Tabs">
                <button data-action="switchTab" data-tab="zip" id="tab-zip"
                    class="border-blue-500 text-blue-600 w-1/2 py-4 px-1 text-center border-b-2 font-medium text-sm flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                    </svg>
                    ZIP Архив
                </button>
                <button data-action="switchTab" data-tab="manual" id="tab-manual"
                    class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 w-1/2 py-4 px-1 text-center border-b-2 font-medium text-sm flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    Ручной ввод
                </button>
            </nav>
        </div>

        <div class="p-6">
            <!-- ZIP Tab Content -->
            <div id="content-zip">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">ZIP Архив</label>
                    <input type="file" id="zip-file" accept=".zip" class="w-full p-2 border border-gray-300 rounded-md">
                    <p class="text-xs text-gray-500 mt-1">
                        Архив должен содержать .session файлы и опционально .json с метаданными
                    </p>
                </div>

                <div class="mb-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-assign-proxy-zip" checked
                            class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-3 text-sm font-medium text-gray-700 flex items-center gap-2">
                            <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                            Автоматически назначить свободные прокси
                        </span>
                    </label>
                </div>

                <div class="flex gap-3">
                    <button data-action="importAccounts"
                        class="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-md font-medium transition">
                        Импорт
                    </button>
                </div>
            </div>

            <!-- Manual Tab Content -->
            <div id="content-manual" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Номер телефона <span
                            class="text-red-500">*</span></label>
                    <input type="text" id="manual-phone" placeholder="+1234567890"
                        class="w-full p-2 border border-gray-300 rounded-md">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API ID <span
                                class="text-red-500">*</span></label>
                        <input type="number" id="manual-api-id" placeholder="123456"
                            class="w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API Hash <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="manual-api-hash" placeholder="abcdef123456..."
                            class="w-full p-2 border border-gray-300 rounded-md">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Session String (Optional)</label>
                    <textarea id="manual-session" rows="3" placeholder="1BVtsOK..."
                        class="w-full p-2 border border-gray-300 rounded-md font-mono text-xs"></textarea>
                </div>

                <div class="p-4 bg-blue-50 rounded-lg border border-blue-200">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-assign-proxy-manual" checked
                            class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-3 text-sm font-medium text-gray-700 flex items-center gap-2">
                            <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                            Автоматически назначить свободный прокси
                        </span>
                    </label>
                </div>

                <div class="flex gap-3 pt-2">
                    <button data-action="createAccount"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-md font-medium transition">
                        Создать аккаунт
                    </button>
                </div>
            </div>

            <!-- Status Area -->
            <div id="import-status" class="mt-4 hidden">
                <div class="p-4 rounded-lg">
                    <p class="text-sm font-medium" id="import-status-text"></p>
                </div>
            </div>
        </div>

        <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-end">
            <button data-action="close-modal" class="text-gray-600 hover:text-gray-800 font-medium text-sm">
                Закрыть
            </button>
        </div>
    </div>
</div>

<!-- Setup Account Modal -->
<div id="setupAccountModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
        <div class="flex justify-between items-center p-6 border-b">
            <h2 class="text-2xl font-bold text-gray-800">Настройка аккаунта</h2>
            <button data-action="close-modal" class="text-gray-500 hover:text-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="p-6">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Номер телефона</label>
                <p id="setup-account-phone" class="text-lg font-medium text-gray-900"></p>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Выберите шаблон</label>
                <select id="setup-template-select" class="w-full p-2 border border-gray-300 rounded-md">
                    <option value="">Загрузка шаблонов...</option>
                </select>
            </div>
        </div>

        <div class="p-6 bg-gray-50 rounded-b-lg flex justify-end gap-3">
            <button data-action="close-modal"
                class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded-lg font-medium transition">
                Отмена
            </button>
            <button data-action="startAccountSetup" id="start-setup-btn"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition">
                Начать настройку
            </button>
        </div>
    </div>
</div>

<script src="/static/js/pages/accounts.page.js?v=999"></script>
