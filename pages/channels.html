<div class="max-w-6xl mx-auto" data-testid="page-channels">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Каналы в мониторинге</h1>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <!-- Total Channels -->
        <div class="stat-card bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
            <div class="stat-label text-sm text-gray-500">Всего каналов</div>
            <div class="stat-value text-lg font-semibold text-gray-800" id="total-channels">0</div>
        </div>
        <!-- Active Channels -->
        <div class="stat-card bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
            <div class="stat-label text-sm text-gray-500">Активных</div>
            <div class="stat-value text-lg font-semibold text-green-600" id="active-channels">0</div>
        </div>
        <!-- Total Comments Posted -->
        <div class="stat-card bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
            <div class="stat-label text-sm text-gray-500">Всего комментов</div>
            <div class="stat-value text-lg font-semibold text-blue-600" id="total-comments">0</div>
        </div>
        <!-- Comments Today -->
        <div class="stat-card bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
            <div class="stat-label text-sm text-gray-500">Комментов сегодня</div>
            <div class="stat-value text-lg font-semibold text-purple-600" id="comments-today">0</div>
        </div>
    </div>

    <!-- Bulk Actions Bar -->
    <div id="bulk-actions-bar" class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-3 flex items-center justify-between" style="display: none;">
        <div class="text-sm text-blue-800 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
            </svg>
            Выбрано каналов: <span id="selected-count" class="font-semibold">0</span>
        </div>
        
        <div class="flex gap-2">
            <button class="btn-danger flex items-center gap-2 px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition" onclick="window.App.pages.channels.deleteSelected()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                </svg>
                Удалить выбранные
            </button>
        </div>
    </div>

    <!-- Search and Filter Bar -->
    <div class="filter-bar bg-white p-4 rounded-lg border border-gray-200 mb-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Search by Name -->
            <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
                <input 
                    type="text" 
                    placeholder="Поиск по названию канала..."
                    class="w-full pl-10 pr-4 py-2 border rounded-lg"
                    id="channel-search"
                />
            </div>
            
            <!-- Filter by Template -->
            <div>
                <select class="w-full px-4 py-2 border rounded-lg" id="template-filter">
                    <option value="">Все шаблоны</option>
                    <!-- Populated dynamically from available templates -->
                </select>
            </div>
        </div>
    </div>

    <!-- Channels Table -->
    <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-700">Список каналов</h2>
            <div class="flex space-x-2">
                <button id="refresh-channels-btn"
                    class="text-gray-600 hover:text-gray-800 p-2 rounded-md transition border border-gray-300 hover:bg-gray-50 bg-white"
                    title="Обновить список">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="overflow-x-auto relative min-h-[200px]">
            <!-- Loading Overlay -->
            <div id="channels-loading"
                class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-10 hidden">
                <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
            </div>

            <table class="min-w-full divide-y divide-gray-200" data-testid="channels-table">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-12">
                            <input type="checkbox" id="select-all" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.447-.112-.906-.112-1.353 0l-4.423 1.106c-.501.125-.852.575-.852 1.091V19.5a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 19.5v-1.372c0-.516.351-.966.852-1.091L7.748 15.852c.447-.112.906-.112 1.353 0l4.423 1.106c.501.125.852.575.852 1.091V19.5a2.25 2.25 0 012.25 2.25h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.447-.112-.906-.112-1.353 0l-4.423 1.106c-.501.125-.852.575-.852 1.091V19.5a2.25 2.25 0 002.25 2.25h2.25a2.25 2.25 0 012.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.447-.112-.906-.112-1.353 0l-4.423 1.106c-.501.125-.852.575-.852 1.091V19.5a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 19.5v-1.372c0-.516.351-.966.852-1.091L7.748 15.852c.447-.112.906-.112 1.353 0l4.423 1.106c.501.125.852.575.852 1.091V19.5a2.25 2.25 0 002.25 2.25h2.25a2.25 2.25 0 012.25-2.25v-1.372c0-.516-.351-.966-.852-1.091L10.748 15.852c-.447-.112-.906-.112-1.353 0l-4.423 1.106c-.501.125-.852.575-.852 1.091V19.5a2.25 2.25 0 002.25 2.25H6a2.25 2.25 0 012.25-2.25v-1.372c0-.516.351-.966.852-1.091L13.948 15.852c.447-.112.906-.112 1.353 0l4.423 1.106c.501.125.852.575.852 1.091V19.5a2.25 2.25 0 012.25 2.25h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.447-.112-.906-.112-1.353 0l-4.423 1.106c-.501.125-.852.575-.852 1.091V19.5a2.25 2.25 0 002.25 2.25h2.25a2.25 2.25 0 012.25-2.25v-1.372c0-.516-.351-.966-.852-1.091L9.748 15.852c-.447-.112-.906-.112-1.353 0l-4.423 1.106c-.501.125-.852.575-.852 1.091V19.5a2.25 2.25 0 01-2.25 2.25H3.75z" />
                                </svg>
                                Название
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 4.56v-1.219c0-.568.422-1.008.98-1.008a1.51 1.51 0 011.5 1.5c0 .317-.093.618-.255.875L21 19.5l-.38.375A1.126 1.126 0 0120 20c-.17 0-.336-.038-.488-.11-.152-.072-.28-.18-.375-.31-.095-.13-.15-.285-.15-.46v-1.219c0-.568.422-1.008.98-1.008.559 0 .981.44.981 1.008v1.219c0 .568-.422 1.008-.98 1.008z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5M12 19.5v1.5M4.5 12h1.5M18 12h1.5M6.75 18.75 5.25 17.25M18.75 18.75 17.25 17.25M18.75 5.25 17.25 6.75M6.75 5.25 5.25 6.75" />
                                </svg>
                                Подписчики
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                Статус
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" />
                                </svg>
                                Шаблон
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.453.379.35.026.67.22.865.544l.758 1.33c.193.342.53.59.905.59h1.591c.375 0 .712-.248.905-.59l.758-1.33c.195-.324.515-.518.865-.544 1.14-.086 2.291-.213 3.453-.379a3.375 3.375 0 002.707-3.227 3.375 3.375 0 00-3.375-3.375H5.25A3.375 3.375 0 001.875 8.25c0-1.6.953-2.883 2.313-3.413.438-.166.88-.305 1.327-.414C6.158 3.75 7.165 3 8.25 3h3.75c1.085 0 2.092.75 2.654 1.813.15.28.292.565.425.855.438.96 1.3 1.676 2.313 1.813.447.109.889.248 1.327.414.85.313 1.522 1.025 1.522 1.813 0 .788-.672 1.499-1.522 1.813a2.25 2.25 0 01-1.327.414c-.447.109-.889.248-1.327.414-.85.313-1.522 1.025-1.522 1.813z" />
                                </svg>
                                Комментов
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                Последний коммент
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z" />
                                </svg>
                                Добавлен
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m0 0l3 3m-3-3l-3 3m0 12h9.75M10.5 18a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0m-3 0h3m0 0l-3 3m3-3l-3-3m0-12h9.75m-9.75 0l3-3m-3 3l3 3" />
                                </svg>
                                Режим
                            </div>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <div class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                </svg>
                                Действия
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="channels-table-body" class="bg-white divide-y divide-gray-200">
                    <!-- Channels will be inserted here -->
                </tbody>
            </table>

            <div id="no-channels" class="hidden text-center py-10 text-gray-500">
                Нет каналов в мониторинге.
            </div>
        </div>
    </div>
</div>
